<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Allergen Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --teal-900:#0a3d40;
  --teal-800:#0f5257;
  --teal-700:#146a70;
  --teal-100:#e3f2f1;
  --amber-500:#f2a93b;
  --amber-600:#e0921c;
  --amber-100:#fdf1dd;
  --coral-600:#d94f4f;
  --coral-100:#fbe6e6;
  --ink-900:#132224;
  --ink-700:#3c5457;
  --ink-500:#6b8386;
  --paper-0:#ffffff;
  --paper-50:#f7faf9;
  --paper-100:#eef4f3;
  --line:#dde8e7;
  --ok-600:#2f8f5b;
  --ok-100:#e5f5ec;
  --radius-lg:20px;
  --radius-md:14px;
  --radius-sm:9px;
  --shadow-card:0 2px 10px rgba(10,61,64,.07), 0 1px 2px rgba(10,61,64,.06);
  --shadow-pop:0 12px 32px rgba(10,61,64,.18);
  --font-display:'Baloo 2', system-ui, sans-serif;
  --font-body:'Inter', system-ui, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--paper-50);
  color:var(--ink-900);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; color:var(--teal-900); line-height:1.15;}
p{margin:0;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
:focus-visible{outline:3px solid var(--amber-500); outline-offset:2px;}
.visually-hidden{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

/* App shell */
#app{min-height:100vh; display:flex; flex-direction:column;}

/* ---------- Top bar (public) ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 18px; background:var(--teal-900); color:#fff;
  position:sticky; top:0; z-index:40;
}
.topbar .brand{display:flex; align-items:center; gap:10px; cursor:pointer; background:none; border:none; color:#fff; padding:4px;}
.brand-mark{
  width:34px; height:34px; border-radius:10px;
  background:linear-gradient(155deg, var(--amber-500), var(--coral-600));
  display:flex; align-items:center; justify-content:center; font-size:18px;
  flex-shrink:0;
}
.brand-text{font-family:var(--font-display); font-weight:700; font-size:17px; letter-spacing:.2px;}
.brand-text small{display:block; font-family:var(--font-body); font-weight:500; font-size:10.5px; opacity:.75; letter-spacing:.4px; text-transform:uppercase; margin-top:1px;}
.icon-btn{
  background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); color:#fff;
  width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:18px; transition:background .15s ease;
}
.icon-btn:hover{background:rgba(255,255,255,.22);}
.topbar-actions{display:flex; gap:8px; align-items:center;}
.back-pill{
  display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18);
  color:#fff; border-radius:999px; padding:8px 14px 8px 10px; font-size:13.5px; font-weight:600;
}

main{flex:1; width:100%;}
.wrap{max-width:1080px; margin:0 auto; padding:20px 18px 60px;}
.wrap-narrow{max-width:720px; margin:0 auto; padding:20px 18px 60px;}

/* ---------- Landing ---------- */
.hero{
  background:radial-gradient(circle at 15% 0%, var(--teal-700), var(--teal-900) 65%);
  color:#fff; padding:44px 18px 54px; text-align:center; position:relative; overflow:hidden;
}
.hero::after{
  content:""; position:absolute; right:-60px; bottom:-60px; width:220px; height:220px; border-radius:50%;
  background:radial-gradient(circle, rgba(242,169,59,.35), transparent 70%);
}
.hero h1{color:#fff; font-size:clamp(26px,6vw,38px); font-weight:700; margin-bottom:8px;}
.hero p{color:rgba(255,255,255,.82); font-size:15.5px; max-width:480px; margin:0 auto;}
.hero .eyebrow{
  display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2);
  padding:6px 14px; border-radius:999px; font-size:12.5px; font-weight:600; letter-spacing:.3px; text-transform:uppercase; margin-bottom:16px;
}
.location-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:14px;
  padding:22px 18px 10px; max-width:1080px; margin:-30px auto 0; position:relative; z-index:5;
}
.brand-group-heading{
  max-width:1080px; margin:24px auto 0; padding:0 18px; font-family:var(--font-display);
  font-size:15px; font-weight:700; color:var(--ink-900); position:relative; z-index:5;
}
.brand-group-heading:first-of-type{margin-top:-10px;}
.location-card{
  background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-lg);
  padding:22px 18px; box-shadow:var(--shadow-card); text-align:left;
  display:flex; align-items:center; gap:14px; transition:transform .15s ease, box-shadow .15s ease;
}
.location-card:hover{transform:translateY(-2px); box-shadow:var(--shadow-pop);}
.location-glyph{
  width:52px; height:52px; border-radius:14px; flex-shrink:0;
  background:linear-gradient(155deg, var(--teal-700), var(--teal-900)); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; font-family:var(--font-display);
}
.location-card h3{font-size:18px; margin-bottom:3px;}
.location-card span{font-size:13px; color:var(--ink-500);}
.empty-note{
  text-align:center; padding:40px 20px; color:var(--ink-500); font-size:14.5px;
}

/* ---------- Category nav & search ---------- */
.section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
.section-title h2{font-size:20px;}
.search-bar{
  display:flex; align-items:center; gap:8px; background:var(--paper-0); border:1.5px solid var(--line);
  border-radius:999px; padding:10px 16px; margin-top:14px;
}
.search-bar input{border:none; outline:none; flex:1; font-size:14.5px; background:transparent; color:var(--ink-900);}
.search-bar input::placeholder{color:var(--ink-500);}
.chip-row{display:flex; gap:8px; overflow-x:auto; padding:14px 0 4px; scrollbar-width:none;}
.chip-row::-webkit-scrollbar{display:none;}
.chip{
  flex-shrink:0; padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:var(--paper-0);
  font-size:13.5px; font-weight:600; color:var(--teal-800); white-space:nowrap;
}
.chip.active{background:var(--teal-900); border-color:var(--teal-900); color:#fff;}

.filter-btn{
  display:flex; align-items:center; gap:8px; background:var(--paper-0); border:1.5px solid var(--line);
  border-radius:999px; padding:10px 16px; font-size:13.5px; font-weight:700; color:var(--teal-900); margin-top:10px;
  box-shadow:var(--shadow-card);
}
.filter-btn .count{background:var(--coral-600); color:#fff; border-radius:999px; font-size:11px; padding:1px 7px; font-weight:700;}

/* Menu grid */
.category-block{margin-top:30px;}
.category-block h2{font-size:19px; margin-bottom:12px; padding-left:2px; border-left:4px solid var(--amber-500); padding-left:10px;}
.item-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(240px,1fr)); gap:14px;}
.item-card{
  background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px;
  box-shadow:var(--shadow-card); text-align:left; display:flex; flex-direction:column; gap:10px; min-height:100%;
}
.item-card h3{font-size:16.5px;}
.item-card p.desc{font-size:13px; color:var(--ink-700); line-height:1.45;}
.tag-row{display:flex; flex-wrap:wrap; gap:6px; margin-top:auto;}
.tag{font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; letter-spacing:.2px;}
.tag.warn{background:var(--coral-100); color:var(--coral-600);}
.tag.may{background:var(--amber-100); color:var(--amber-600);}
.tag.clear{background:var(--ok-100); color:var(--ok-600);}
.tag.veg{background:#e5f3df; color:#3f7d2c;}
.tag.halal{background:#e6f0f5; color:#2b5f7a;}
.tag.muted{background:var(--paper-100); color:var(--ink-500);}

/* ---------- Item detail ---------- */
.item-hero{padding:22px 0 6px;}
.item-hero h1{font-size:26px; margin-bottom:6px;}
.item-hero p{color:var(--ink-700); font-size:14.5px; line-height:1.5;}
.item-hero .cat-label{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; color:var(--teal-700); margin-bottom:8px; display:block;}

.allergen-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:10px; margin-top:14px;}
.allergen-tile{
  border-radius:var(--radius-sm); padding:12px 14px; display:flex; align-items:center; gap:10px; border:1.5px solid transparent;
}
.allergen-tile.present{background:var(--coral-100); border-color:#f2c2c2;}
.allergen-tile.may{background:var(--amber-100); border-color:#f4dfae;}
.allergen-tile.absent{background:var(--paper-100); border-color:var(--line);}
.allergen-tile .ic{font-size:18px; width:26px; text-align:center; flex-shrink:0;}
.allergen-tile .lbl{font-weight:700; font-size:13.5px; color:var(--ink-900); display:block;}
.allergen-tile .status{font-size:10.5px; font-weight:700; letter-spacing:.4px; text-transform:uppercase;}
.allergen-tile.present .status{color:var(--coral-600);}
.allergen-tile.may .status{color:var(--amber-600);}
.allergen-tile.absent .status{color:var(--ink-500);}

.ingredient-list{display:flex; flex-direction:column; gap:10px; margin-top:12px;}
.ingredient-row{
  background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); padding:13px 15px;
  width:100%; text-align:left; display:flex; align-items:center; gap:10px; cursor:pointer; position:relative;
  font-family:inherit; transition:border-color .15s, box-shadow .15s;
}
.ingredient-row:hover, .ingredient-row:focus-visible{border-color:var(--teal-800); box-shadow:0 0 0 2px var(--teal-100);}
.ingredient-row .name{font-weight:700; font-size:14.5px; display:block; flex-shrink:0; margin-right:4px;}
.ingredient-row .mini-tags{display:flex; flex-wrap:wrap; gap:6px; flex:1;}
.ingredient-row .chev{font-size:20px; color:var(--ink-500); flex-shrink:0; margin-left:auto;}
.mini-tag{font-size:11px; font-weight:700; background:var(--coral-100); color:var(--coral-600); padding:3px 8px; border-radius:999px;}
.mini-tag.none{background:var(--ok-100); color:var(--ok-600);}
.mini-tag.may{background:var(--amber-100); color:var(--amber-600);}

.notes-box{
  margin-top:16px; background:var(--paper-100); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:14px 16px; font-size:13.5px; color:var(--ink-700); line-height:1.55;
}
.notes-box strong{display:block; font-family:var(--font-display); font-size:12px; text-transform:uppercase; letter-spacing:.4px; margin-bottom:5px; color:var(--ink-900);}
.cal-pill{display:inline-block; margin-top:8px; background:var(--teal-100); color:var(--teal-800); font-weight:700; font-size:12.5px; padding:5px 12px; border-radius:999px;}

.disclaimer-box{
  margin-top:22px; background:var(--teal-100); border:1px solid #c7dedb; border-radius:var(--radius-md);
  padding:15px 16px; font-size:13px; color:var(--teal-900); line-height:1.55;
}
.disclaimer-box strong{display:block; margin-bottom:4px; font-size:13.5px;}

/* ---------- Filter drawer ---------- */
.drawer-overlay{
  position:fixed; inset:0; background:rgba(10,34,36,.45); z-index:80; display:flex; align-items:flex-end; justify-content:center;
}
.drawer{
  background:var(--paper-0); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:20px 20px 26px;
  max-height:86vh; overflow-y:auto; box-shadow:0 -10px 30px rgba(0,0,0,.2);
}
.drawer-handle{width:40px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px;}
.drawer h2{font-size:19px; margin-bottom:4px;}
.drawer .sub{font-size:13px; color:var(--ink-500); margin-bottom:16px;}
.mode-toggle{display:flex; background:var(--paper-100); border-radius:999px; padding:4px; margin-bottom:16px;}
.mode-toggle button{flex:1; border:none; background:transparent; padding:9px; border-radius:999px; font-size:13px; font-weight:700; color:var(--ink-700);}
.mode-toggle button.active{background:var(--teal-900); color:#fff;}
.allergen-check-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.allergen-check{
  display:flex; align-items:center; gap:9px; border:1.5px solid var(--line); border-radius:12px; padding:11px 12px; font-size:13.5px; font-weight:600;
}
.allergen-check.checked{border-color:var(--teal-800); background:var(--teal-100);}
.allergen-check input{width:17px; height:17px; accent-color:var(--teal-800);}
.drawer-footer{display:flex; gap:10px; margin-top:20px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; border:none; border-radius:12px;
  padding:12px 18px; font-size:14px; font-weight:700; transition:transform .1s ease, opacity .15s ease;
}
.btn:active{transform:scale(.98);}
.btn-primary{background:var(--teal-900); color:#fff;}
.btn-primary:hover{background:var(--teal-800);}
.btn-amber{background:var(--amber-500); color:var(--ink-900);}
.btn-amber:hover{background:var(--amber-600);}
.btn-ghost{background:var(--paper-100); color:var(--teal-900);}
.btn-ghost:hover{background:var(--paper-100); opacity:.8;}
.btn-danger{background:var(--coral-100); color:var(--coral-600);}
.btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink-900);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px; font-size:12.5px; border-radius:9px;}
.btn[disabled]{opacity:.45; pointer-events:none;}

/* ============================================================
   ADMIN / BACK OFFICE
   ============================================================ */
.admin-shell{display:flex; min-height:100vh; background:var(--paper-50);}
.admin-sidebar{
  width:230px; background:var(--teal-900); color:#fff; flex-shrink:0; display:flex; flex-direction:column; padding:18px 12px;
  position:sticky; top:0; height:100vh; overflow-y:auto;
}
.admin-sidebar .brand-text{color:#fff;}
.admin-nav{margin-top:24px; display:flex; flex-direction:column; gap:4px; flex:1;}
.admin-nav button{
  display:flex; align-items:center; gap:10px; text-align:left; background:none; border:none; color:rgba(255,255,255,.78);
  padding:11px 12px; border-radius:10px; font-size:13.8px; font-weight:600;
}
.admin-nav button.active{background:rgba(255,255,255,.14); color:#fff;}
.admin-nav button:hover{background:rgba(255,255,255,.08);}
.admin-nav .ic{width:18px; text-align:center;}
.admin-exit{margin-top:auto; padding-top:14px; border-top:1px solid rgba(255,255,255,.14);}
.admin-exit .signed-in-as{font-size:11.5px; color:rgba(255,255,255,.7); padding:0 4px 8px;}
.admin-exit .signed-in-as strong{color:#fff;}
.admin-exit button{width:100%; background:rgba(255,255,255,.1); color:#fff; border:none; border-radius:10px; padding:11px; font-size:13px; font-weight:700;}
.admin-main{flex:1; padding:26px 30px 60px; min-width:0;}
.admin-topline{display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:20px;}
.admin-topline h1{font-size:23px;}
.admin-topline .sub{color:var(--ink-500); font-size:13.5px; margin-top:2px;}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px,1fr)); gap:14px; margin-bottom:26px;}
.stat-card{
  background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); padding:16px 18px; box-shadow:var(--shadow-card);
}
.stat-card .num{font-family:var(--font-display); font-size:28px; color:var(--teal-900); font-weight:700;}
.stat-card .lbl{font-size:12.5px; color:var(--ink-500); font-weight:600; margin-top:2px;}
.quick-actions{display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px;}

.panel{background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); box-shadow:var(--shadow-card); overflow:hidden;}
.panel-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap;}
.panel-head h2{font-size:17px;}
.panel-search{display:flex; align-items:center; gap:8px; background:var(--paper-100); border-radius:999px; padding:8px 14px; min-width:200px;}
.panel-search input{border:none; background:transparent; outline:none; font-size:13.5px; flex:1;}

table{width:100%; border-collapse:collapse;}
th{text-align:left; font-size:11.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--ink-500); padding:11px 16px; border-bottom:1px solid var(--line); background:var(--paper-50);}
td{padding:13px 16px; border-bottom:1px solid var(--line); font-size:13.8px; vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.row-actions{display:flex; gap:6px; flex-wrap:wrap;}
.status-pill{font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;}
.group-row td{background:var(--paper-100); font-size:12.5px; color:var(--ink-700); padding:8px 14px !important;}
.status-pill.active{background:var(--ok-100); color:var(--ok-600);}
.status-pill.inactive{background:var(--paper-100); color:var(--ink-500);}
.warn-pill{background:var(--coral-100); color:var(--coral-600); font-size:11px; font-weight:700; padding:3px 10px; border-radius:999px;}
.small-meta{font-size:12px; color:var(--ink-500);}
.badge-chip{display:inline-block; font-size:11px; font-weight:700; background:var(--teal-100); color:var(--teal-800); padding:3px 9px; border-radius:999px; margin:2px 3px 0 0;}
.badge-chip.warn{background:var(--coral-100); color:var(--coral-600);}
.badge-chip.may{background:var(--amber-100); color:var(--amber-600);}
.badge-chip.cal{background:var(--paper-100); color:var(--ink-700);}

.table-scroll{overflow-x:auto;}
.empty-row{text-align:center; color:var(--ink-500); padding:36px 16px; font-size:13.5px;}

/* Modal / form */
.modal-overlay{position:fixed; inset:0; background:rgba(10,34,36,.5); z-index:90; display:flex; align-items:center; justify-content:center; padding:16px; overflow-y:auto;}
.modal{background:var(--paper-0); width:100%; max-width:560px; border-radius:18px; padding:24px; box-shadow:var(--shadow-pop); max-height:90vh; overflow-y:auto;}
.modal h2{font-size:19px; margin-bottom:4px;}
.modal .sub{font-size:13px; color:var(--ink-500); margin-bottom:18px;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-700); margin-bottom:6px;}
.field .hint{font-size:11.5px; color:var(--ink-500); margin-top:5px;}
.field input[type=text], .field input[type=password], .field textarea, .field select{
  width:100%; border:1.5px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13.8px; color:var(--ink-900); background:var(--paper-0);
}
.field textarea{resize:vertical; min-height:64px;}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--teal-700);}
.checkbox-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.checkbox-row{display:flex; align-items:center; gap:9px; border:1.5px solid var(--line); border-radius:10px; padding:9px 11px; font-size:13px; font-weight:600;}
.checkbox-row input{width:16px; height:16px; accent-color:var(--teal-800);}
.checkbox-row.checked{border-color:var(--teal-800); background:var(--teal-100);}

.allergen-status-list{display:flex; flex-direction:column; gap:6px;}
.allergen-status-row{display:flex; align-items:center; justify-content:space-between; gap:10px; border:1.5px solid var(--line); border-radius:10px; padding:8px 8px 8px 12px; flex-wrap:wrap;}
.allergen-status-row .name{font-size:13px; font-weight:600; flex:1 1 150px;}
.status-toggle{display:flex; gap:2px; background:var(--paper-100); border-radius:999px; padding:3px; flex-shrink:0;}
.status-toggle input{display:none;}
.status-toggle label{font-size:11px; font-weight:700; padding:7px 10px; border-radius:999px; color:var(--ink-500);}
.status-toggle label.sel{background:var(--paper-0); color:var(--ink-900); box-shadow:var(--shadow-card);}
.status-toggle label.sel-may{color:var(--amber-600);}
.status-toggle label.sel-contains{color:var(--coral-600);}
@media (max-width:520px){
  .status-toggle{width:100%;}
  .status-toggle label{flex:1; text-align:center;}
}
.toggle-row{display:flex; align-items:center; justify-content:space-between; border:1.5px solid var(--line); border-radius:10px; padding:11px 13px;}
.switch{position:relative; width:42px; height:24px; flex-shrink:0;}
.switch input{opacity:0; width:0; height:0;}
.switch .track{position:absolute; inset:0; background:var(--line); border-radius:999px; transition:.15s;}
.switch .track::before{content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s;}
.switch input:checked + .track{background:var(--ok-600);}
.switch input:checked + .track::before{transform:translateX(18px);}
.modal-footer{display:flex; gap:10px; justify-content:flex-end; margin-top:22px; padding-top:16px; border-top:1px solid var(--line);}

.ing-picker{border:1.5px solid var(--line); border-radius:12px; padding:10px; max-height:260px; overflow-y:auto;}
.ing-picker-row{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 6px; border-bottom:1px solid var(--paper-100);}
.ing-picker-row:last-child{border-bottom:none;}
.ing-picker-row .name{font-size:13.5px; font-weight:600;}
.ing-picker-row .allergen-mini{font-size:11px; color:var(--ink-500); margin-top:2px;}
.selected-ing-list{display:flex; flex-direction:column; gap:6px; margin-top:10px;}
.selected-ing-chip{
  display:flex; align-items:center; justify-content:space-between; background:var(--paper-100); border-radius:10px; padding:8px 10px; font-size:13px; font-weight:600;
}
.selected-ing-chip .move-btns{display:flex; gap:4px;}
.mini-icon-btn{background:var(--paper-0); border:1px solid var(--line); border-radius:6px; width:24px; height:24px; font-size:12px; display:flex; align-items:center; justify-content:center;}

.computed-box{background:var(--teal-100); border-radius:12px; padding:12px 14px; margin-top:10px;}
.computed-box .title{font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; color:var(--teal-800); margin-bottom:6px;}

.login-shell{min-height:100vh; display:flex; align-items:center; justify-content:center; background:radial-gradient(circle at 20% 10%, var(--teal-700), var(--teal-900) 70%); padding:20px;}
.login-card{background:var(--paper-0); border-radius:20px; padding:32px 28px; width:100%; max-width:380px; box-shadow:var(--shadow-pop); text-align:center;}
.login-card .brand-mark{margin:0 auto 14px;}
.login-card h1{font-size:21px; margin-bottom:6px;}
.login-card p{color:var(--ink-500); font-size:13.5px; margin-bottom:22px;}
.login-error{background:var(--coral-100); color:var(--coral-600); border-radius:10px; padding:10px 12px; font-size:12.5px; font-weight:600; margin-bottom:14px; text-align:left;}
.login-hint{margin-top:16px; font-size:11.5px; color:var(--ink-500); background:var(--paper-100); border-radius:10px; padding:10px 12px; text-align:left; line-height:1.5;}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink-900); color:#fff;
  padding:12px 20px; border-radius:999px; font-size:13.5px; font-weight:600; z-index:200; box-shadow:0 8px 24px rgba(0,0,0,.25);
  display:flex; align-items:center; gap:8px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.confirm-modal .modal{max-width:400px; text-align:left;}

.settings-card{background:var(--paper-0); border:1px solid var(--line); border-radius:var(--radius-md); padding:20px; box-shadow:var(--shadow-card); margin-bottom:16px;}
.settings-card h3{font-size:15.5px; margin-bottom:4px;}
.settings-card .sub{font-size:12.5px; color:var(--ink-500); margin-bottom:14px;}
.file-drop{border:1.5px dashed var(--line); border-radius:12px; padding:18px; text-align:center; font-size:13px; color:var(--ink-500);}

.no-ing-warn{background:var(--coral-100); color:var(--coral-600); font-size:12px; font-weight:700; padding:8px 12px; border-radius:9px; margin-top:8px;}

@media (max-width: 880px){
  .admin-shell{flex-direction:column;}
  .admin-sidebar{width:100%; height:auto; position:sticky; top:0; flex-direction:row; align-items:center; padding:10px 14px; overflow-x:auto; z-index:50;}
  .admin-sidebar .brand{flex-shrink:0;}
  .admin-nav{flex-direction:row; margin-top:0; margin-left:14px; overflow-x:auto;}
  .admin-nav button{white-space:nowrap;}
  .admin-exit{margin-top:0; margin-left:auto; border-top:none; padding-top:0; flex-shrink:0;}
  .admin-exit button{padding:9px 12px;}
  .admin-main{padding:18px 14px 50px;}
  .checkbox-grid{grid-template-columns:1fr;}
  .allergen-check-grid{grid-template-columns:1fr;}
}

/* ---------- Print (item detail allergen sheet) ---------- */
.print-only{display:none;}
@media print{
  .no-print, .topbar, .drawer-overlay, .modal-overlay, #toast, .filter-btn, .chip-row{display:none !important;}
  body{background:#fff;}
  .wrap-narrow{max-width:100%; padding:0;}
  .print-only{display:block;}
  .print-header{font-family:var(--font-display); font-weight:700; font-size:13px; letter-spacing:.3px; text-transform:uppercase; color:#000; border-bottom:2px solid #000; padding-bottom:8px; margin-bottom:14px;}
  .item-hero h1{color:#000;}
  .item-hero p{color:#333;}
  .allergen-grid{grid-template-columns:repeat(2, 1fr) !important; gap:6px;}
  .allergen-tile{border:1px solid #999 !important; background:#fff !important; break-inside:avoid;}
  .allergen-tile.present{border:2px solid #000 !important;}
  .allergen-tile.may{border:2px dashed #000 !important;}
  .allergen-tile .lbl, .allergen-tile .status{color:#000 !important;}
  .ingredient-row{border:1px solid #ccc; break-inside:avoid;}
  .mini-tag{background:#eee !important; color:#000 !important; border:1px solid #999;}
  .disclaimer-box{background:#fff; border:1px solid #999; color:#000;}
  .print-footer{margin-top:16px; font-size:11px; color:#555; border-top:1px solid #ccc; padding-top:8px;}
}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
(function(){
"use strict";

/* ============================================================
   1. CONSTANTS
   ============================================================ */
var ALLERGENS = [
  {key:'gluten', label:'Cereals containing gluten', icon:'🌾'},
  {key:'crustaceans', label:'Crustaceans', icon:'🦐'},
  {key:'eggs', label:'Eggs', icon:'🥚'},
  {key:'fish', label:'Fish', icon:'🐟'},
  {key:'peanuts', label:'Peanuts', icon:'🥜'},
  {key:'soybeans', label:'Soybeans', icon:'🌱'},
  {key:'milk', label:'Milk', icon:'🥛'},
  {key:'nuts', label:'Nuts', icon:'🌰'},
  {key:'celery', label:'Celery', icon:'🥬'},
  {key:'mustard', label:'Mustard', icon:'🌭'},
  {key:'sesame', label:'Sesame', icon:'🫘'},
  {key:'sulphites', label:'Sulphites', icon:'🍷'},
  {key:'lupin', label:'Lupin', icon:'🌼'},
  {key:'molluscs', label:'Molluscs', icon:'🐚'}
];
function allergenLabel(key){ for(var i=0;i<ALLERGENS.length;i++){ if(ALLERGENS[i].key===key) return ALLERGENS[i].label; } return key; }

/* Neutral brand mark (shield + check) — deliberately generic so the same
   system can sit behind any brand or venue without carrying another
   brand's imagery. */
var BRAND_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'+
  '<path d="M12 2.5L20 5.5V11C20 16 16.8 19.7 12 21.5C7.2 19.7 4 16 4 11V5.5L12 2.5Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>'+
  '<path d="M8.5 12L11 14.5L15.8 9.5" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'+
'</svg>';
var APP_TITLE = 'Allergen Guide';

var DISCLAIMER = "Allergen information is provided based on the ingredients and product information available to us. Recipes, ingredients and preparation methods may change. If you have a food allergy or intolerance, please speak to a member of our team before ordering. We cannot guarantee that food is completely free from traces of allergens.";

var STORAGE_KEY = 'vf_allergy_db_v1';

/* ============================================================
   2. DATA LAYER
   (Kept deliberately separate from rendering. This is the only
   part of the app that would need to change if/when this moves
   from localStorage to a real API / database backend. Every
   function below returns plain data — nothing here touches the DOM.)
   ============================================================ */
function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
}

/* ============================================================
   DATA LAYER — Supabase (shared, live database)
   Replaces the earlier localStorage prototype. The anon key below is
   designed to be public — it's meaningless without the Row Level
   Security rules set up in the database, which control what it can
   actually read or write.
   ============================================================ */
var SUPABASE_URL = 'https://wapswwplvygtwyoyoyjo.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhcHN3d3BsdnlndHd5b3lveWpvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3ODMyOTgsImV4cCI6MjEwNDM1OTI5OH0.j6qRVyGH6mz8oJg7DefCYHIkVAfMOLO2gmPVu2oXnSI';
var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var db = { locations:[], categories:[], ingredients:[], menuItems:[], settings:{ admins:[], showCalories:false } };
var profileNameById = {}; // uuid -> display name/email, for "Updated by" labels

function resolveUpdatedBy(uuid){
  if(!uuid) return 'Unknown';
  return profileNameById[uuid] || 'A team member';
}

/* Maps a raw Supabase row (snake_case) to the shape the rest of the app
   (written before the backend migration) already expects, so the large
   majority of render/business logic below needed no changes at all. */
function mapLocation(r){ return { id:r.id, name:r.name, description:r.description||'', address:r.address||'', brand:r.brand||'', displayOrder:r.display_order||0, active:r.active, updatedBy:resolveUpdatedBy(r.updated_by), updatedAt:r.updated_at }; }
function mapCategory(r){ return { id:r.id, name:r.name, description:r.description||'', displayOrder:r.display_order, active:r.active, updatedBy:resolveUpdatedBy(r.updated_by), updatedAt:r.updated_at }; }
function mapIngredient(r){ return { id:r.id, name:r.name, description:r.description||'', allergens:r.allergens||[], mayContain:r.may_contain||[], calories:r.calories, brand:r.brand_name||'', supplier:r.supplier||'', vegetarian:!!r.vegetarian, halal:!!r.halal, active:r.active, updatedBy:resolveUpdatedBy(r.updated_by), updatedAt:r.updated_at }; }
function mapMenuItem(r, locRows, ingRows){
  return {
    id:r.id, name:r.name, description:r.description||'', categoryId:r.category_id, active:r.active,
    updatedBy:resolveUpdatedBy(r.updated_by), updatedAt:r.updated_at,
    locationIds: locRows.filter(function(x){ return x.menu_item_id===r.id; }).map(function(x){ return x.location_id; }),
    ingredientIds: ingRows.filter(function(x){ return x.menu_item_id===r.id; }).sort(function(a,b){ return a.sort_order-b.sort_order; }).map(function(x){ return x.ingredient_id; })
  };
}
function mapProfile(r){ return { id:r.id, username:r.email, displayName:r.display_name||r.email, role:r.role, active:r.active }; }

/* Converts any thrown value to a plain string before it's logged.
   Some preview/embedding environments relay console output via
   postMessage, which throws its own confusing error if you hand it a
   raw object containing non-cloneable things like a fetch Headers
   instance — so we never log anything but plain text. */
function safeErrText(e){
  try{
    if(!e) return 'Unknown error';
    if(typeof e === 'string') return e;
    if(e.message) return String(e.message);
    return String(e);
  }catch(_){ return 'Unknown error'; }
}

var LOAD_ERROR = null;

async function loadAllData(){
  LOAD_ERROR = null;
  try{
    var profRes = await sb.from('profiles').select('*');
    if(profRes.error) throw profRes.error;
    profileNameById = {};
    (profRes.data||[]).forEach(function(p){ profileNameById[p.id] = p.display_name || p.email; });

    var results = await Promise.all([
      sb.from('locations').select('*'),
      sb.from('categories').select('*').order('display_order'),
      sb.from('ingredients').select('*'),
      sb.from('menu_items').select('*'),
      sb.from('menu_item_locations').select('*'),
      sb.from('menu_item_ingredients').select('*'),
      sb.from('app_settings').select('*').eq('id', true).single()
    ]);
    results.forEach(function(r, idx){ if(r.error && idx<6) throw r.error; }); // app_settings missing is non-fatal (older DB before this table existed)
    var locR=results[0].data||[], catR=results[1].data||[], ingR=results[2].data||[], miR=results[3].data||[], milR=results[4].data||[], mieR=results[5].data||[];
    var appSettingsRow = results[6] && !results[6].error ? results[6].data : null;

    db.locations = locR.map(mapLocation);
    db.categories = catR.map(mapCategory);
    db.ingredients = ingR.map(mapIngredient);
    db.menuItems = miR.map(function(r){ return mapMenuItem(r, milR, mieR); });
    db.settings.admins = (profRes.data||[]).map(mapProfile);
    db.settings.showCalories = appSettingsRow ? !!appSettingsRow.show_calories : false;
  }catch(e){
    console.error('Supabase load failed: ' + safeErrText(e));
    LOAD_ERROR = (e && e.message) ? e.message : 'Could not reach the database.';
  }
}

/* ---- Generic Supabase write helpers, used by every entity's form below ---- */
async function sbInsert(table, row){
  var res = await sb.from(table).insert(row).select().single();
  if(res.error) throw res.error;
  return res.data;
}
async function sbUpdate(table, id, row){
  var res = await sb.from(table).update(row).eq('id', id).select().single();
  if(res.error) throw res.error;
  return res.data;
}
async function sbDelete(table, id){
  var res = await sb.from(table).delete().eq('id', id);
  if(res.error) throw res.error;
}
/* Wraps an async form-submit/delete handler: shows a clear toast on
   failure instead of silently doing nothing, and never lets a failed
   write pretend to have succeeded in the UI. */
function withBusy(fn){
  var p = fn();
  if(p && p.catch){
    p.catch(function(e){ console.error('Action failed: ' + safeErrText(e)); toast((e && e.message) ? e.message : 'Something went wrong \u2014 please try again.'); });
  }
  return p;
}

function stamp(data){
  data.updated_by = state.admin.currentUserId || null;
  data.updated_at = new Date().toISOString();
  return data;
}
/* ---- Login convenience (NOT security) ----
   Remembers the last email typed, purely so staff don't have to retype
   it every time. Never stores the password — that's handled entirely
   by Supabase Auth now. */
var ADMIN_EMAIL_KEY = 'vf_allergy_last_admin_email';
function getLastAdminEmail(){
  try{ return localStorage.getItem(ADMIN_EMAIL_KEY) || ''; }catch(e){ return ''; }
}
function setLastAdminEmail(email){
  try{ localStorage.setItem(ADMIN_EMAIL_KEY, email); }catch(e){}
}
function formatUpdated(record){
  if(!record || !record.updatedAt) return '';
  var d = new Date(record.updatedAt);
  var dateStr = isNaN(d.getTime()) ? '' : d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
  return 'Updated by '+esc(record.updatedBy||'Unknown')+(dateStr?' · '+dateStr:'');
}

/* ---- calculation: single source of truth is the ingredient ----
   Returns {contains:[...], mayContain:[...]}.
   If ANY connected ingredient definitely contains an allergen, the menu
   item is marked "Contains" for that allergen — that always wins.
   If no ingredient definitely contains it, but at least one connected
   ingredient "may contain" it, the menu item is marked "May Contain". */
function getMenuItemAllergens(menuItem, db){
  var containsSet = {}, maySet = {};
  (menuItem.ingredientIds||[]).forEach(function(iid){
    var ing = db.ingredients.find(function(i){ return i.id===iid; });
    if(!ing) return;
    (ing.allergens||[]).forEach(function(a){ containsSet[a]=true; });
    (ing.mayContain||[]).forEach(function(a){ maySet[a]=true; });
  });
  var contains = Object.keys(containsSet);
  var mayContain = Object.keys(maySet).filter(function(a){ return !containsSet[a]; });
  return { contains: contains, mayContain: mayContain };
}
/* Convenience: every allergen key touched (contains OR may contain) —
   used wherever we need to treat "may contain" as a risk too. */
function getMenuItemAtRiskAllergens(menuItem, db){
  var ai = getMenuItemAllergens(menuItem, db);
  return ai.contains.concat(ai.mayContain);
}

/* ---- calorie calculation ----
   Calories are a background/staff-only field until Settings > "Show
   calories to customers" is switched on. Even then, we only ever show a
   total to a customer once every connected ingredient has a value —
   a partial total would be misleading, not just incomplete. */
function getMenuItemCalories(menuItem, db){
  var ids = menuItem.ingredientIds || [];
  var total = 0, missing = 0, found = 0;
  ids.forEach(function(iid){
    var ing = db.ingredients.find(function(i){ return i.id===iid; });
    if(!ing) return;
    found++;
    if(typeof ing.calories === 'number' && !isNaN(ing.calories)){ total += ing.calories; }
    else { missing++; }
  });
  return { total: total, ingredientCount: found, missingCount: missing, complete: found>0 && missing===0 };
}

/* ---- dietary suitability calculation ----
   Unlike allergens (where ONE ingredient having something is enough to
   flag the whole dish), vegetarian/halal work the other way round — a
   dish is only vegetarian if EVERY ingredient in it is, and the same for
   halal. An item with no ingredients connected is treated as unknown,
   not suitable, since there's nothing to base the claim on. */
function getMenuItemDietary(menuItem, db){
  var ids = menuItem.ingredientIds || [];
  var ings = ids.map(function(iid){ return db.ingredients.find(function(i){ return i.id===iid; }); }).filter(Boolean);
  if(!ings.length) return { vegetarian:false, halal:false };
  return {
    vegetarian: ings.every(function(i){ return !!i.vegetarian; }),
    halal: ings.every(function(i){ return !!i.halal; })
  };
}

/* ---- location brand grouping ----
   Groups locations by their (optional) brand, each group internally
   sorted by displayOrder. Groups themselves are sorted alphabetically by
   brand name, with unbranded locations trailing last as "Locations". */
function groupLocationsByBrand(locs){
  var groups = {};
  var order = [];
  locs.forEach(function(l){
    var key = (l.brand||'').trim();
    if(!groups[key]){ groups[key] = []; order.push(key); }
    groups[key].push(l);
  });
  order.sort(function(a,b){
    if(!a && b) return 1;   // unbranded last
    if(a && !b) return -1;
    return a.localeCompare(b);
  });
  return order.map(function(key){
    return {
      brand: key || null,
      locations: groups[key].slice().sort(function(a,b){ return a.displayOrder-b.displayOrder; })
    };
  });
}

/* ============================================================
   3. APP STATE
   ============================================================ */
var state = {
  screen: 'landing',        // landing | menu | item | ingredient
  locationId: null,
  categoryFilter: 'all',
  allergenFilterOpen: false,
  allergenFilterMode: 'exclude', // 'exclude' = does NOT contain, 'include' = contains
  allergenFilterSelected: [],
  dietaryFilter: { vegetarian:false, halal:false },
  menuItemId: null,
  ingredientId: null,
  admin: {
    loggedIn: false,
    screen: 'dashboard',   // dashboard|locations|categories|ingredients|menuitems|team|settings
    search: '',
    loginError: '',
    currentUser: '',
    currentUserId: '',
    currentUserRole: ''
  },
  modal: null,   // {type, payload}
  confirm: null  // {message, onConfirm}
};

function go(patch){ Object.assign(state, patch); render(); window.scrollTo(0,0); }
function setModal(m){ state.modal = m; render(); }
function closeModal(){ state.modal = null; render(); }

function toast(msg){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2200);
}

function confirmAction(message, onConfirm){
  state.confirm = {message:message, onConfirm:onConfirm};
  render();
}

/* ============================================================
   4. RENDER HELPERS
   ============================================================ */
function el(html){
  var t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstChild;
}
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}

/* Viewer accounts have no admin dashboard to go to (see_admin gating below),
   so once logged in their only path back is to log out — the gear icon
   becomes a log-out button for them instead of a link to the login screen. */
function topbarGearButton(){
  if(state.admin.loggedIn && state.admin.currentUserRole==='viewer'){
    return '<button class="icon-btn" id="viewerLogout" title="Log out" aria-label="Log out">🔓</button>';
  }
  return '<button class="icon-btn" id="openAdmin" title="Back office" aria-label="Back office login">⚙️</button>';
}

/* ============================================================
   5. PUBLIC: LANDING
   ============================================================ */
function renderLanding(){
  var activeLocs = db.locations.filter(function(l){ return l.active; });
  var groups = groupLocationsByBrand(activeLocs);
  function cardHtml(l){
    return '<button class="location-card" data-landloc="'+l.id+'">'+
      '<div class="location-glyph">'+esc(l.name.charAt(0))+'</div>'+
      '<div><h3>'+esc(l.name)+'</h3><span>'+esc(l.address||'Tap to view menu')+'</span></div>'+
    '</button>';
  }
  var showHeadings = groups.length > 1;
  var groupsHtml = groups.map(function(g){
    var heading = showHeadings ? '<h2 class="brand-group-heading">'+esc(g.brand||'Other locations')+'</h2>' : '';
    return heading + '<div class="location-grid">'+g.locations.map(cardHtml).join('')+'</div>';
  }).join('');
  var content = ''+
    '<div class="hero">'+
      '<div class="eyebrow">Allergy &amp; Ingredient Guide</div>'+
      '<h1>Where are you visiting?</h1>'+
      '<p>Pick your location to see the menu and full allergen information.</p>'+
    '</div>'+
    (groupsHtml || '<div class="location-grid"><div class="empty-note">No locations are available right now. Please ask a team member for help.</div></div>')+
    '<div class="wrap-narrow"><div class="disclaimer-box"><strong>Please note</strong>'+esc(DISCLAIMER)+'</div></div>';

  return '<div class="topbar">'+
      '<button class="brand" id="brandHome"><div class="brand-mark">'+BRAND_SVG+'</div><div class="brand-text">'+esc(APP_TITLE)+'</div></button>'+
      topbarGearButton()+
    '</div>'+
    '<main>'+content+'</main>';
}

/* ============================================================
   6. PUBLIC: MENU
   ============================================================ */
function itemMatchesAllergenFilter(item){
  if(state.allergenFilterSelected.length===0) return true;
  var ai = getMenuItemAllergens(item, db);
  if(state.allergenFilterMode==='exclude'){
    /* "Does NOT contain" is a safety filter — an item that "may contain"
       a selected allergen is excluded too, not just a confirmed "contains". */
    var atRisk = ai.contains.concat(ai.mayContain);
    return !state.allergenFilterSelected.some(function(a){ return atRisk.indexOf(a)!==-1; });
  } else {
    /* "Does contain" only matches a confirmed Contains, not a May Contain. */
    return state.allergenFilterSelected.every(function(a){ return ai.contains.indexOf(a)!==-1; });
  }
}

function itemMatchesDietaryFilter(item){
  var f = state.dietaryFilter;
  if(!f.vegetarian && !f.halal) return true;
  var d = getMenuItemDietary(item, db);
  if(f.vegetarian && !d.vegetarian) return false;
  if(f.halal && !d.halal) return false;
  return true;
}

function renderMenu(){
  var loc = db.locations.find(function(l){ return l.id===state.locationId; });
  if(!loc){ go({screen:'landing'}); return ''; }

  var allItems = db.menuItems.filter(function(m){ return m.active && m.locationIds.indexOf(loc.id)!==-1; });
  var filtered = allItems.filter(function(m){
    if(state.categoryFilter!=='all' && m.categoryId!==state.categoryFilter && !(state.categoryFilter==='uncategorised' && !m.categoryId)) return false;
    return itemMatchesAllergenFilter(m) && itemMatchesDietaryFilter(m);
  });

  var usedCatIds = {};
  allItems.forEach(function(m){ usedCatIds[m.categoryId || 'uncategorised']=true; });
  var cats = db.categories.filter(function(c){ return c.active && usedCatIds[c.id]; }).sort(function(a,b){ return a.displayOrder-b.displayOrder; });

  var chipRow = '<div class="chip-row">'+
    '<button class="chip '+(state.categoryFilter==='all'?'active':'')+'" data-cat="all">All</button>'+
    cats.map(function(c){ return '<button class="chip '+(state.categoryFilter===c.id?'active':'')+'" data-cat="'+c.id+'">'+esc(c.name)+'</button>'; }).join('')+
    (usedCatIds['uncategorised'] ? '<button class="chip '+(state.categoryFilter==='uncategorised'?'active':'')+'" data-cat="uncategorised">Uncategorised</button>' : '')+
  '</div>';

  var grouped = '';
  if(state.categoryFilter==='all'){
    var groups = cats.map(function(c){ return {id:c.id, name:c.name}; });
    if(usedCatIds['uncategorised']) groups.push({id:'uncategorised', name:'Uncategorised'});
    groups.forEach(function(g){
      var groupItems = filtered.filter(function(m){ return (m.categoryId||'uncategorised')===g.id; });
      if(groupItems.length===0) return;
      grouped += '<div class="category-block"><h2>'+esc(g.name)+'</h2><div class="item-grid">'+groupItems.map(renderItemCard).join('')+'</div></div>';
    });
  } else {
    grouped = '<div class="category-block"><div class="item-grid">'+filtered.map(renderItemCard).join('')+'</div></div>';
  }
  if(filtered.length===0){
    grouped = '<div class="empty-note">No menu items match your search or filter.<br>Try adjusting the allergen filter above.</div>';
  }

  var filterCount = state.allergenFilterSelected.length + (state.dietaryFilter.vegetarian?1:0) + (state.dietaryFilter.halal?1:0);

  return '<div class="topbar">'+
      '<button class="back-pill" id="backToLanding">← <span>Locations</span></button>'+
      '<div class="topbar-actions">'+topbarGearButton()+'</div>'+
    '</div>'+
    '<main><div class="wrap">'+
      '<div class="section-title"><h2>'+esc(loc.name)+'</h2></div>'+
      chipRow+
      '<button class="filter-btn" id="openFilter">🧪 Filter by allergen &amp; diet '+(filterCount>0?'<span class="count">'+filterCount+'</span>':'')+'</button>'+
      grouped+
      '<div class="disclaimer-box" style="margin-top:34px;"><strong>Please note</strong>'+esc(DISCLAIMER)+'</div>'+
    '</div></main>'+
    (state.allergenFilterOpen ? renderFilterDrawer() : '');
}

function renderItemCard(m){
  var ai = getMenuItemAllergens(m, db);
  var diet = getMenuItemDietary(m, db);
  var total = ai.contains.length + ai.mayContain.length;
  var shown = ai.contains.slice(0,4).map(function(a){ return '<span class="tag warn">'+esc(allergenLabel(a))+'</span>'; });
  if(shown.length<4){ shown = shown.concat(ai.mayContain.slice(0,4-shown.length).map(function(a){ return '<span class="tag may">May contain '+esc(allergenLabel(a))+'</span>'; })); }
  var tags = total
    ? shown.join('') + (total>4 ? '<span class="tag muted">+'+(total-4)+' more</span>' : '')
    : '<span class="tag clear">No listed allergens</span>';
  var dietBadges = (diet.vegetarian?'<span class="tag veg">🌱 Vegetarian</span>':'')+(diet.halal?'<span class="tag halal">☾ Halal</span>':'');
  return '<button class="item-card" data-item="'+m.id+'">'+
    '<h3>'+esc(m.name)+'</h3>'+
    (m.description ? '<p class="desc">'+esc(m.description)+'</p>' : '')+
    (dietBadges ? '<div class="tag-row" style="margin-bottom:6px;">'+dietBadges+'</div>' : '')+
    '<div class="tag-row">'+tags+'</div>'+
  '</button>';
}

  var logicLine = selected.length

        : 'Showing items that contain: '+selected.map(allergenLabel).join(', '))
    : 'Select one or more allergens below.';
  return '<div class="drawer-overlay" id="filterOverlay"><div class="drawer">'+
    '<div class="drawer-handle"></div>'+
    '<h2>Filter by allergen &amp; diet</h2>'+
    '<div class="section-title" style="margin-top:0;"><h2>Dietary</h2></div>'+

      '<label class="allergen-check '+(state.dietaryFilter.vegetarian?'checked':'')+'"><input type="checkbox" data-dietary="vegetarian" '+(state.dietaryFilter.vegetarian?'checked':'')+'> 🌱 Vegetarian</label>'+
      '<label class="allergen-check '+(state.dietaryFilter.halal?'checked':'')+'"><input type="checkbox" data-dietary="halal" '+(state.dietaryFilter.halal?'checked':'')+'> ☾ Halal friendly</label>'+

}

function renderItemDetail(){

    var status = ai.contains.indexOf(a.key)!==-1 ? 'present' : (ai.mayContain.indexOf(a.key)!==-1 ? 'may' : 'absent');

    return '<div class="allergen-tile '+status+'">'+
      '<span class="ic">'+a.icon+'</span>'+

        (diet.vegetarian?'<span class="tag veg" style="margin-right:6px;">🌱 Vegetarian</span>':'')+(diet.halal?'<span class="tag halal">☾ Halal friendly</span>':'')+
        (showCalToCustomers ? '<span class="cal-pill">~'+cal.total+' kcal</span>' : '')+
      '</div>'+
      (showPrint?'<button class="btn btn-outline btn-sm no-print" id="printItem2" style="margin-top:4px;">🖨️ Print this page (staff only)</button>':'')+

  var list = db.ingredients.filter(function(i){ return !term || i.name.toLowerCase().indexOf(term)!==-1 || (i.brand||'').toLowerCase().indexOf(term)!==-1 || (i.supplier||'').toLowerCase().indexOf(term)!==-1; });
  var rows = list.map(function(i){
    var usedBy = db.menuItems.filter(function(m){ return m.ingredientIds.indexOf(i.id)!==-1; });
    var badges = (i.allergens||[]).map(function(a){ return '<span class="badge-chip warn">'+esc(allergenLabel(a))+'</span>'; }).join('')
      + (i.mayContain||[]).map(function(a){ return '<span class="badge-chip may">May: '+esc(allergenLabel(a))+'</span>'; }).join('');
    if(!badges) badges = '<span class="small-meta">No listed allergens</span>';
    var calBadge = typeof i.calories==='number' ? '<span class="badge-chip cal">'+i.calories+' kcal</span>' : '<span class="small-meta">Calories not set</span>';
    var dietBadges = (i.vegetarian?'<span class="badge-chip" style="background:#e5f3df; color:#3f7d2c;">🌱 Veg</span>':'')+(i.halal?'<span class="badge-chip" style="background:#e6f0f5; color:#2b5f7a;">☾ Halal</span>':'');
    var brandSupplierLine = (i.brand||i.supplier) ? '<div class="small-meta">'+[i.brand, i.supplier].filter(Boolean).join(' · ')+'</div>' : '';
    var updatedLine = formatUpdated(i);
    return '<tr><td><strong>'+esc(i.name)+'</strong>'+brandSupplierLine+(i.description?'<div class="small-meta">'+esc(i.description)+'</div>':'')+(updatedLine?'<div class="small-meta">'+updatedLine+'</div>':'')+'</td>'+
      '<td style="max-width:260px;">'+badges+'</td>'+
      '<td>'+calBadge+'</td>'+
      '<td>'+(dietBadges||'<span class="small-meta">—</span>')+'</td>'+
      '<td class="small-meta">Used in '+usedBy.length+' item(s)</td>'+
      '<td><span class="status-pill '+(i.active?'active':'inactive')+'">'+(i.active?'Active':'Inactive')+'</span></td>'+
      '<td><div class="row-actions">'+
        '<button class="btn btn-outline btn-sm" data-edit-ing="'+i.id+'">Edit</button>'+
        '<button class="btn btn-ghost btn-sm" data-toggle-ing="'+i.id+'">'+(i.active?'Deactivate':'Activate')+'</button>'+
        '<button class="btn btn-danger btn-sm" data-delete-ing="'+i.id+'">Delete</button>'+
      '</div></td></tr>';
  }).join('');
  var inner = adminPanel('Ingredients', 'The source of truth for allergen information. Menu items calculate their allergens from here. Brand and supplier are for your team only \u2014 customers never see them.', 'Add ingredient', 'ingredient', rows,
    ['Ingredient','Allergens','Calories','Dietary','Usage','Status','Actions'], list.length);
  return renderAdminShell(inner);
}

function renderAdminMenuItems(){
  var term = state.admin.search.trim().toLowerCase();
  var list = db.menuItems.filter(function(m){ return !term || m.name.toLowerCase().indexOf(term)!==-1; });
  var rows = list.map(function(m){
    var cat = db.categories.find(function(c){ return c.id===m.categoryId; });
    var ai = getMenuItemAllergens(m, db);
    var locs = m.locationIds.map(function(lid){ var l=db.locations.find(function(x){return x.id===lid;}); return l?l.name:null; }).filter(Boolean);
    var flags = '';
    if(!m.ingredientIds || m.ingredientIds.length===0) flags += '<div class="warn-pill" style="margin-top:4px;">No ingredients</div>';
    if(locs.length===0) flags += '<div class="warn-pill" style="margin-top:4px;">No active locations</div>';
    var allergenCell = ai.contains.map(function(a){return '<span class="badge-chip warn">'+esc(allergenLabel(a))+'</span>';}).join('')
      + ai.mayContain.map(function(a){return '<span class="badge-chip may">May: '+esc(allergenLabel(a))+'</span>';}).join('');
    if(!allergenCell) allergenCell = '<span class="small-meta">No listed allergens</span>';
    var cal = getMenuItemCalories(m, db);
    var calCell = cal.ingredientCount===0 ? '<span class="small-meta">—</span>'
      : cal.complete ? '<span class="badge-chip cal">'+cal.total+' kcal</span>'
      : '<span class="small-meta">'+cal.missingCount+' of '+cal.ingredientCount+' ingredient(s) missing calories</span>';
    var updatedLine = formatUpdated(m);
    return '<tr><td><strong>'+esc(m.name)+'</strong><div class="small-meta">'+esc(cat?cat.name:'Uncategorised')+'</div>'+(updatedLine?'<div class="small-meta">'+updatedLine+'</div>':'')+flags+'</td>'+
      '<td style="max-width:220px;">'+allergenCell+'</td>'+
      '<td>'+calCell+'</td>'+
      '<td class="small-meta">'+(locs.join(', ')||'—')+'</td>'+
      '<td><span class="status-pill '+(m.active?'active':'inactive')+'">'+(m.active?'Active':'Inactive')+'</span></td>'+
      '<td><div class="row-actions">'+
        '<button class="btn btn-outline btn-sm" data-edit-mi="'+m.id+'">Edit</button>'+
        '<button class="btn btn-ghost btn-sm" data-toggle-mi="'+m.id+'">'+(m.active?'Deactivate':'Activate')+'</button>'+
        '<button class="btn btn-danger btn-sm" data-delete-mi="'+m.id+'">Delete</button>'+
      '</div></td></tr>';
  }).join('');
  var inner = adminPanel('Menu items', 'Create products once, then connect ingredients and assign locations.', 'Add menu item', 'menuitem', rows,
    ['Item','Allergens (calculated)','Calories','Locations','Status','Actions'], list.length);
  return renderAdminShell(inner);
}

var menuItemFormState = null; // {name,description,categoryId,locationIds,ingredientIds,active,ingSearch}

function renderMenuItemModal(){
  var editing = state.modal.payload;
  if(!menuItemFormState){
    menuItemFormState = editing ? JSON.parse(JSON.stringify(editing)) : {name:'', description:'', categoryId:'', locationIds:[], ingredientIds:[], active:true};
    menuItemFormState.ingSearch = '';
  }
  var f = menuItemFormState;

  var catOptions = db.categories.filter(function(c){return c.active;}).sort(function(a,b){return a.displayOrder-b.displayOrder;})
    .map(function(c){ return '<option value="'+c.id+'" '+(f.categoryId===c.id?'selected':'')+'>'+esc(c.name)+'</option>'; }).join('');

  var locChecks = db.locations.map(function(l){
    var checked = f.locationIds.indexOf(l.id)!==-1;
    return '<label class="checkbox-row '+(checked?'checked':'')+' '+(l.active?'':'')+'"><input type="checkbox" data-loc="'+l.id+'" '+(checked?'checked':'')+'> '+esc(l.name)+(l.active?'':' (inactive)')+'</label>';
  }).join('');

  var term = (f.ingSearch||'').toLowerCase();
  var pickableIngs = db.ingredients.filter(function(i){ return i.active && f.ingredientIds.indexOf(i.id)===-1 && (!term || i.name.toLowerCase().indexOf(term)!==-1); });
  var pickerRows = pickableIngs.slice(0,30).map(function(i){
    var bits = [];
    if(i.allergens.length) bits.push('Contains: '+i.allergens.map(allergenLabel).join(', '));
    if((i.mayContain||[]).length) bits.push('May contain: '+i.mayContain.map(allergenLabel).join(', '));
    var mini = bits.length ? bits.join(' · ') : 'No listed allergens';
    return '<div class="ing-picker-row"><div><div class="name">'+esc(i.name)+'</div><div class="allergen-mini">'+mini+'</div></div>'+
      '<button type="button" class="btn btn-outline btn-sm" data-add-ing="'+i.id+'">Add</button></div>';
  }).join('') || '<div class="small-meta" style="padding:8px;">No matching ingredients.</div>';

  var selectedRows = f.ingredientIds.map(function(iid, idx){
    var i = db.ingredients.find(function(x){return x.id===iid;});
    if(!i) return '';
    return '<div class="selected-ing-chip"><span>'+esc(i.name)+'</span><div class="move-btns">'+
      (idx>0?'<button type="button" class="mini-icon-btn" data-move-ing="up:'+iid+'">↑</button>':'')+
      (idx<f.ingredientIds.length-1?'<button type="button" class="mini-icon-btn" data-move-ing="down:'+iid+'">↓</button>':'')+
      '<button type="button" class="mini-icon-btn" data-remove-ing="'+iid+'">✕</button>'+
    '</div></div>';
  }).join('');

  var computedContains = [], computedMay = [];
  (function(){
    var cSet = {}, mSet = {};
    f.ingredientIds.forEach(function(iid){
      var i = db.ingredients.find(function(x){return x.id===iid;});
      if(!i) return;
      (i.allergens||[]).forEach(function(a){ cSet[a]=true; });
      (i.mayContain||[]).forEach(function(a){ mSet[a]=true; });
    });
    computedContains = Object.keys(cSet);
    computedMay = Object.keys(mSet).filter(function(a){ return !cSet[a]; });
  })();

  return modalWrap(
    '<h2>'+(editing?'Edit menu item':'Add menu item')+'</h2><p class="sub">Connect ingredients below — allergens are calculated automatically.</p>'+
    '<div id="miForm">'+
      '<div class="field"><label for="miName">Menu item name *</label><input type="text" id="miName" value="'+esc(f.name)+'" required></div>'+
      '<div class="field"><label for="miDesc">Description</label><textarea id="miDesc">'+esc(f.description)+'</textarea></div>'+
      '<div class="field"><label for="miCat">Category</label><select id="miCat"><option value="">Uncategorised</option>'+catOptions+'</select></div>'+
      '<div class="field"><label>Available at locations</label><div class="checkbox-grid">'+locChecks+'</div></div>'+
      '<div class="field"><label>Connected ingredients</label>'+
        '<input type="text" id="ingSearchInput" placeholder="Search ingredients to add…" value="'+esc(f.ingSearch)+'" style="width:100%; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; font-size:13.5px; margin-bottom:8px;">'+
        '<div class="ing-picker">'+pickerRows+'</div>'+
        (f.ingredientIds.length ? '<div class="selected-ing-list">'+selectedRows+'</div>' : '<div class="no-ing-warn" style="margin-top:10px;">No ingredients connected yet — this item will show no listed allergens.</div>')+
      '</div>'+
      '<div class="computed-box"><div class="title">Calculated allergens (from ingredients)</div>'+
        (computedContains.length || computedMay.length
          ? computedContains.map(function(a){return '<span class="badge-chip warn">'+esc(allergenLabel(a))+'</span>';}).join('')
            + computedMay.map(function(a){return '<span class="badge-chip may">May: '+esc(allergenLabel(a))+'</span>';}).join('')
          : '<span class="small-meta">No listed allergens</span>')+
      '</div>'+
      '<div class="computed-box"><div class="title">Calories (background field, hidden from customers)</div>'+
        (function(){
          var cal = getMenuItemCalories({ingredientIds:f.ingredientIds}, db);
          if(cal.ingredientCount===0) return '<span class="small-meta">Add ingredients to calculate.</span>';
          if(cal.complete) return '<span class="badge-chip cal">'+cal.total+' kcal total</span>';
          return '<span class="small-meta">'+cal.missingCount+' of '+cal.ingredientCount+' connected ingredient(s) have no calorie value set yet — add these on the Ingredients screen to complete the total.</span>';
        })()+
      '</div>'+
      '<div class="computed-box"><div class="title">Dietary (calculated from ingredients)</div>'+
        (function(){
          if(!f.ingredientIds.length) return '<span class="small-meta">Add ingredients to calculate.</span>';
          var d = getMenuItemDietary({ingredientIds:f.ingredientIds}, db);
          var badges = (d.vegetarian?'<span class="badge-chip" style="background:#e5f3df; color:#3f7d2c;">🌱 Vegetarian</span>':'')+(d.halal?'<span class="badge-chip" style="background:#e6f0f5; color:#2b5f7a;">☾ Halal</span>':'');
          return badges || '<span class="small-meta">Not vegetarian or halal — at least one connected ingredient isn\u2019t marked as either.</span>';
        })()+
      '</div>'+
      '<div class="toggle-row" style="margin-top:16px;"><span>Active</span><label class="switch"><input type="checkbox" id="miActive" '+(f.active?'checked':'')+'><span class="track"></span></label></div>'+

      '</div>'+
    '</div>',
    'mi-modal'
  );
}

function renderAccountModal(){

function renderConfirmModal(){
  var c = state.confirm;
  return '<div class="modal-overlay confirm-modal"><div class="modal">'+
    '<h2>Please confirm</h2><p class="sub">'+esc(c.message)+'</p>'+

/* ============================================================
   16. MASTER RENDER
   ============================================================ */
function render(){
  var html = '';
  var showAdmin = state.admin.loggedIn && state.admin.currentUserRole!=='viewer' && state.screen!=='landing' && state.screen!=='menu' && state.screen!=='item' && state.screen!=='ingredient';
  if(showAdmin){
    switch(state.admin.screen){
      case 'locations': html = renderAdminLocations(); break;
      case 'categories': html = renderAdminCategories(); break;
      case 'ingredients': html = renderAdminIngredients(); break;
      case 'menuitems': html = renderAdminMenuItems(); break;
      case 'team': html = renderAdminTeam(); break;
      case 'settings': html = renderAdminSettings(); break;
      default: html = renderAdminDashboard();
    }
  } else if(state.screen==='adminLogin'){
    html = renderAdminLogin();
  } else if(state.screen==='menu'){
    html = renderMenu();
  } else if(state.screen==='item'){
    html = renderItemDetail();
  } else if(state.screen==='ingredient'){
    html = renderIngredientDetail();
  } else {
    html = renderLanding();
  }

  var modalHtml = '';
  if(state.modal){
    if(state.modal.type==='location') modalHtml = renderLocationModal();
    else if(state.modal.type==='category') modalHtml = renderCategoryModal();
    else if(state.modal.type==='ingredient') modalHtml = renderIngredientModal();
    else if(state.modal.type==='menuitem') modalHtml = renderMenuItemModal();
    else if(state.modal.type==='account') modalHtml = renderAccountModal();
  }
  if(state.confirm){ modalHtml += renderConfirmModal(); }

  document.getElementById('app').innerHTML = html + modalHtml;
  attachEvents();
}

/* ============================================================
   17. EVENT WIRING
   (Simple re-render-on-every-change pattern — event listeners are
   attached fresh after each render since we rebuild innerHTML.)
   ============================================================ */
function attachEvents(){
  var app = document.getElementById('app');

  /* ---- Public: landing ---- */
  app.querySelectorAll('[data-landloc]').forEach(function(b){
    b.addEventListener('click', function(){ go({screen:'menu', locationId:b.getAttribute('data-landloc'), categoryFilter:'all', allergenFilterSelected:[], dietaryFilter:{vegetarian:false, halal:false}}); });
  });
  var brandHome = document.getElementById('brandHome'); if(brandHome) brandHome.addEventListener('click', function(){ go({screen:'landing'}); });
  var brandHomeAdmin = document.getElementById('brandHomeAdmin'); if(brandHomeAdmin) brandHomeAdmin.addEventListener('click', function(){ sb.auth.signOut(); go({screen:'landing', admin:Object.assign({}, state.admin, {loggedIn:false, currentUserRole:''})}); });
  var openAdmin = document.getElementById('openAdmin'); if(openAdmin) openAdmin.addEventListener('click', function(){ go({screen:'adminLogin'}); state.admin.loginError=''; });

  /* ---- Public: menu ---- */
  var backToLanding = document.getElementById('backToLanding'); if(backToLanding) backToLanding.addEventListener('click', function(){ go({screen:'landing'}); });
  var backToMenu = document.getElementById('backToMenu'); if(backToMenu) backToMenu.addEventListener('click', function(){ go({screen:'menu'}); });
  var backToItem = document.getElementById('backToItem'); if(backToItem) backToItem.addEventListener('click', function(){ go({screen:'item'}); });
  var printIng = document.getElementById('printIng'); if(printIng) printIng.addEventListener('click', function(){ window.print(); });
  var printIng2 = document.getElementById('printIng2'); if(printIng2) printIng2.addEventListener('click', function(){ window.print(); });
  app.querySelectorAll('[data-open-ing]').forEach(function(b){
    b.addEventListener('click', function(){ go({screen:'ingredient', ingredientId:b.getAttribute('data-open-ing')}); });
  });
  var printItem = document.getElementById('printItem'); if(printItem) printItem.addEventListener('click', function(){ window.print(); });
  var printItem2 = document.getElementById('printItem2'); if(printItem2) printItem2.addEventListener('click', function(){ window.print(); });
  app.querySelectorAll('[data-cat]').forEach(function(b){
    b.addEventListener('click', function(){ go({categoryFilter:b.getAttribute('data-cat')}); });
  });
  app.querySelectorAll('[data-item]').forEach(function(b){
    b.addEventListener('click', function(){ go({screen:'item', menuItemId:b.getAttribute('data-item')}); });
  });
  var openFilter = document.getElementById('openFilter'); if(openFilter) openFilter.addEventListener('click', function(){ go({allergenFilterOpen:true}); });
  var filterOverlay = document.getElementById('filterOverlay');
  if(filterOverlay){
    filterOverlay.addEventListener('click', function(e){ if(e.target===filterOverlay) go({allergenFilterOpen:false}); });
    app.querySelectorAll('[data-mode]').forEach(function(b){ b.addEventListener('click', function(){ state.allergenFilterMode = b.getAttribute('data-mode'); render(); }); });
    app.querySelectorAll('[data-allergen]').forEach(function(b){
      b.addEventListener('change', function(){
        var key = b.getAttribute('data-allergen');
        var idx = state.allergenFilterSelected.indexOf(key);
        if(b.checked && idx===-1) state.allergenFilterSelected.push(key);
        if(!b.checked && idx!==-1) state.allergenFilterSelected.splice(idx,1);
        render();
      });
    });
    app.querySelectorAll('[data-dietary]').forEach(function(b){
      b.addEventListener('change', function(){
        state.dietaryFilter[b.getAttribute('data-dietary')] = b.checked;
        render();
      });
    });
    var clearFilter = document.getElementById('clearFilter'); if(clearFilter) clearFilter.addEventListener('click', function(){ go({allergenFilterSelected:[], dietaryFilter:{vegetarian:false, halal:false}}); });
    var applyFilter = document.getElementById('applyFilter'); if(applyFilter) applyFilter.addEventListener('click', function(){ go({allergenFilterOpen:false}); });
  }

  /* ---- Admin: login ---- */
  var authEmail = document.getElementById('authEmail');
  var authPassword = document.getElementById('authPassword');
  var loginSubmitBtn = document.getElementById('loginSubmitBtn');
  async function attemptLogin(){
    var email = authEmail ? authEmail.value.trim() : '';
    var pw = authPassword ? authPassword.value : '';
    if(!email || !pw){
      state.admin.loginError = 'Enter your email and password.';
      render();
      return;
    }
    if(loginSubmitBtn){ loginSubmitBtn.disabled = true; loginSubmitBtn.textContent = 'Signing in\u2026'; }
    try{
      var res = await sb.auth.signInWithPassword({ email: email, password: pw });
      if(res.error) throw res.error;
      var userId = res.data.user.id;
      // profiles may not be loaded fresh if this is a brand-new account — refetch to be sure
      await loadAllData();
      if(LOAD_ERROR){ throw new Error(LOAD_ERROR); }
      var match = db.settings.admins.find(function(a){ return a.id===userId; });
      if(!match || !match.active){
        await sb.auth.signOut();
        state.admin.loginError = match ? 'This account has been deactivated.' : 'Signed in, but no back-office profile was found for this account.';
        render();
        return;
      }
      state.admin.loggedIn = true; state.admin.loginError='';
      state.admin.currentUser = match.displayName || match.username;
      state.admin.currentUserId = match.id;
      state.admin.currentUserRole = match.role;
      if(match.role==='viewer'){
        state.screen = 'landing'; // viewers have no admin dashboard — straight to the menu to browse & print
      } else {
        state.admin.screen = 'dashboard';
      }
      setLastAdminEmail(email);
      render();
    }catch(e){
      console.error('Login failed: ' + safeErrText(e));
      state.admin.loginError = (e && e.message) ? e.message : 'Incorrect email or password.';
      render();
      setTimeout(function(){ var p2=document.getElementById('authPassword'); if(p2) p2.focus(); },0);
    }
  }
  if(loginSubmitBtn){ loginSubmitBtn.addEventListener('click', attemptLogin); }
  if(authEmail){
    setTimeout(function(){ authEmail.focus(); },0);
  }
  if(authPassword){
    authPassword.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); attemptLogin(); } });
  }
  var cancelLogin = document.getElementById('cancelLogin'); if(cancelLogin) cancelLogin.addEventListener('click', function(){ go({screen:'landing'}); });

  /* ---- Admin: nav ---- */
  app.querySelectorAll('[data-adminnav]').forEach(function(b){
    b.addEventListener('click', function(){ state.admin.screen = b.getAttribute('data-adminnav'); state.admin.search=''; render(); });
  });
  var viewPublic = document.getElementById('viewPublic'); if(viewPublic) viewPublic.addEventListener('click', function(){ go({screen:'landing'}); });
  var logoutAdmin = document.getElementById('logoutAdmin'); if(logoutAdmin) logoutAdmin.addEventListener('click', function(){ sb.auth.signOut(); state.admin.loggedIn=false; state.admin.currentUserRole=''; go({screen:'landing'}); });
  var viewerLogout = document.getElementById('viewerLogout'); if(viewerLogout) viewerLogout.addEventListener('click', function(){ sb.auth.signOut(); state.admin.loggedIn=false; state.admin.currentUserRole=''; toast('Logged out'); go({screen:'landing'}); });

  /* ---- Admin: search boxes ---- */
  var adminSearch = document.getElementById('adminSearch');
  if(adminSearch){
    adminSearch.addEventListener('input', function(){ state.admin.search = adminSearch.value; render(); setTimeout(function(){ var el2=document.getElementById('adminSearch'); if(el2){el2.focus(); el2.setSelectionRange(el2.value.length, el2.value.length);} },0); });
  }

  /* ---- Admin: quick add buttons ---- */
  app.querySelectorAll('[data-quickadd]').forEach(function(b){
    b.addEventListener('click', function(){
      var type = b.getAttribute('data-quickadd');
      if(type==='menuitem') menuItemFormState = null;
      setModal({type:type, payload:null});
    });
  });

  /* ---- Locations table ---- */
  app.querySelectorAll('[data-edit-loc]').forEach(function(b){
    b.addEventListener('click', function(){ var l = db.locations.find(function(x){return x.id===b.getAttribute('data-edit-loc');}); setModal({type:'location', payload:l}); });
  });
  app.querySelectorAll('[data-toggle-loc]').forEach(function(b){
    b.addEventListener('click', function(){
      var l = db.locations.find(function(x){return x.id===b.getAttribute('data-toggle-loc');});
      withBusy(async function(){
        var updated = await sbUpdate('locations', l.id, stamp({active: !l.active}));
        Object.assign(l, mapLocation(updated));
        toast(l.name+' is now '+(l.active?'active':'inactive')); render();
      });
    });
  });
  app.querySelectorAll('[data-delete-loc]').forEach(function(b){
    b.addEventListener('click', function(){
      var l = db.locations.find(function(x){return x.id===b.getAttribute('data-delete-loc');});
      var used = db.menuItems.filter(function(m){ return m.locationIds.indexOf(l.id)!==-1; }).length;
      confirmAction('Permanently delete "'+l.name+'"? This cannot be undone.'+(used?' It will be removed from '+used+' menu item(s).':''), function(){
        withBusy(async function(){
          await sbDelete('locations', l.id); // ON DELETE CASCADE removes it from menu_item_locations for us
          db.locations = db.locations.filter(function(x){return x.id!==l.id;});
          db.menuItems.forEach(function(m){ m.locationIds = m.locationIds.filter(function(id){return id!==l.id;}); });
          state.confirm=null; toast(l.name+' deleted permanently'); render();
        });
      });
    });
  });

  /* ---- Categories table ---- */
  app.querySelectorAll('[data-edit-cat]').forEach(function(b){
    b.addEventListener('click', function(){ var c = db.categories.find(function(x){return x.id===b.getAttribute('data-edit-cat');}); setModal({type:'category', payload:c}); });
  });
  app.querySelectorAll('[data-toggle-cat]').forEach(function(b){
    b.addEventListener('click', function(){
      var c = db.categories.find(function(x){return x.id===b.getAttribute('data-toggle-cat');});
      withBusy(async function(){
        var updated = await sbUpdate('categories', c.id, stamp({active: !c.active}));
        Object.assign(c, mapCategory(updated));
        toast(c.name+' is now '+(c.active?'active':'inactive')); render();
      });
    });
  });
  app.querySelectorAll('[data-delete-cat]').forEach(function(b){
    b.addEventListener('click', function(){
      var c = db.categories.find(function(x){return x.id===b.getAttribute('data-delete-cat');});
      var used = db.menuItems.filter(function(m){return m.categoryId===c.id;}).length;
      confirmAction('Permanently delete "'+c.name+'"? This cannot be undone.'+(used?' '+used+' menu item(s) will become Uncategorised.':''), function(){
        withBusy(async function(){
          await sbDelete('categories', c.id); // menu_items.category_id is ON DELETE SET NULL
          db.categories = db.categories.filter(function(x){return x.id!==c.id;});
          db.menuItems.forEach(function(m){ if(m.categoryId===c.id) m.categoryId=null; });
          state.confirm=null; toast(c.name+' deleted permanently'); render();
        });
      });
    });
  });
  app.querySelectorAll('[data-move-cat]').forEach(function(b){
    b.addEventListener('click', function(){
      var parts = b.getAttribute('data-move-cat').split(':'); var dir = parts[0], id = parts[1];
      var sorted = db.categories.slice().sort(function(a,b2){return a.displayOrder-b2.displayOrder;});
      var idx = sorted.findIndex(function(c){return c.id===id;});
      var swapIdx = dir==='up' ? idx-1 : idx+1;
      if(swapIdx<0 || swapIdx>=sorted.length) return;
      var a = sorted[idx], bItem = sorted[swapIdx];
      var aOrd = a.displayOrder, bOrd = bItem.displayOrder;
      withBusy(async function(){
        await Promise.all([
          sbUpdate('categories', a.id, {display_order: bOrd}),
          sbUpdate('categories', bItem.id, {display_order: aOrd})
        ]);
        a.displayOrder = bOrd; bItem.displayOrder = aOrd;
        render();
      });
    });
  });
  app.querySelectorAll('[data-move-loc]').forEach(function(b){
    b.addEventListener('click', function(){
      var parts = b.getAttribute('data-move-loc').split(':'); var dir = parts[0], id = parts[1];
      var moving = db.locations.find(function(l){ return l.id===id; });
      if(!moving) return;
      // Only ever reorder within the same brand group — cross-brand order doesn't mean anything.
      var siblings = db.locations.filter(function(l){ return (l.brand||'').trim()===(moving.brand||'').trim(); })
        .slice().sort(function(a,b2){return a.displayOrder-b2.displayOrder;});
      var idx = siblings.findIndex(function(l){return l.id===id;});
      var swapIdx = dir==='up' ? idx-1 : idx+1;
      if(swapIdx<0 || swapIdx>=siblings.length) return;
      var a = siblings[idx], bItem = siblings[swapIdx];
      var aOrd = a.displayOrder, bOrd = bItem.displayOrder;
      withBusy(async function(){
        await Promise.all([
          sbUpdate('locations', a.id, {display_order: bOrd}),
          sbUpdate('locations', bItem.id, {display_order: aOrd})
        ]);
        a.displayOrder = bOrd; bItem.displayOrder = aOrd;
        render();
      });

  /* ---- Ingredients table ---- */
