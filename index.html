    b.addEventListener('click', function(){ var i = db.ingredients.find(function(x){return x.id===b.getAttribute('data-edit-ing');}); setModal({type:'ingredient', payload:i}); });
  });
  app.querySelectorAll('[data-toggle-ing]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = db.ingredients.find(function(x){return x.id===b.getAttribute('data-toggle-ing');});
      function doToggle(){
        withBusy(async function(){
          var updated = await sbUpdate('ingredients', i.id, stamp({active: !i.active}));
          Object.assign(i, mapIngredient(updated));
          toast(i.name+' is now '+(i.active?'active':'inactive')); render();
        });
      }
      if(i.active){
        var usedBy = db.menuItems.filter(function(m){ return m.active && m.ingredientIds.indexOf(i.id)!==-1; });
        if(usedBy.length){
          confirmAction('"'+i.name+'" is still used by '+usedBy.length+' active menu item(s): '+usedBy.map(function(m){return m.name;}).join(', ')+'. Deactivate anyway?', function(){ state.confirm=null; doToggle(); });
          return;
        }
      }
      doToggle();
    });
  });
  app.querySelectorAll('[data-delete-ing]').forEach(function(b){
    b.addEventListener('click', function(){
      var i = db.ingredients.find(function(x){return x.id===b.getAttribute('data-delete-ing');});
      var usedBy = db.menuItems.filter(function(m){ return m.ingredientIds.indexOf(i.id)!==-1; });
      confirmAction('Permanently delete "'+i.name+'"? This cannot be undone.'+(usedBy.length?' It will be removed from '+usedBy.length+' menu item(s): '+usedBy.map(function(m){return m.name;}).join(', ')+'. Their allergen info will recalculate automatically.':''), function(){
        withBusy(async function(){
          await sbDelete('ingredients', i.id); // ON DELETE CASCADE removes it from menu_item_ingredients for us
          db.ingredients = db.ingredients.filter(function(x){return x.id!==i.id;});
          db.menuItems.forEach(function(m){ m.ingredientIds = m.ingredientIds.filter(function(id){return id!==i.id;}); });
          state.confirm=null; toast(i.name+' deleted permanently'); render();
        });
      });
    });
  });

  /* ---- Menu items table ---- */
  app.querySelectorAll('[data-edit-mi]').forEach(function(b){
    b.addEventListener('click', function(){ var m = db.menuItems.find(function(x){return x.id===b.getAttribute('data-edit-mi');}); menuItemFormState=null; setModal({type:'menuitem', payload:m}); });
  });
  app.querySelectorAll('[data-toggle-mi]').forEach(function(b){
    b.addEventListener('click', function(){
      var m = db.menuItems.find(function(x){return x.id===b.getAttribute('data-toggle-mi');});
      withBusy(async function(){
        var updated = await sbUpdate('menu_items', m.id, stamp({active: !m.active}));
        m.active = updated.active; m.updatedBy = resolveUpdatedBy(updated.updated_by); m.updatedAt = updated.updated_at;
        toast(m.name+' is now '+(m.active?'active':'inactive')); render();
      });
    });
  });
  app.querySelectorAll('[data-delete-mi]').forEach(function(b){
    b.addEventListener('click', function(){
      var m = db.menuItems.find(function(x){return x.id===b.getAttribute('data-delete-mi');});
      confirmAction('Permanently delete "'+m.name+'"? This cannot be undone.', function(){
        withBusy(async function(){
          await sbDelete('menu_items', m.id);
          db.menuItems = db.menuItems.filter(function(x){return x.id!==m.id;});
          state.confirm=null; toast(m.name+' deleted permanently'); render();
        });
      });
    });
  });

  /* ---- Modal: overlay click to close ---- */
  var modalOverlay = document.getElementById('modalOverlay');
  if(modalOverlay){ modalOverlay.addEventListener('click', function(e){ if(e.target===modalOverlay){ menuItemFormState=null; closeModal(); } }); }
  var cancelModalBtn = document.getElementById('cancelModal'); if(cancelModalBtn) cancelModalBtn.addEventListener('click', function(){ menuItemFormState=null; closeModal(); });

  /* ---- Location form ---- */
  var locForm = document.getElementById('locForm');
  if(locForm){
    function submitLocForm(){
      var name = document.getElementById('locName').value.trim();
      if(!name){ toast('Location name is required'); return; }
      var payload = state.modal.payload;
      var brand = document.getElementById('locBrand').value.trim();
      var row = stamp({
        name:name,
        brand:brand,
        address:document.getElementById('locAddr').value.trim(),
        description:document.getElementById('locDesc').value.trim(),
        active:document.getElementById('locActive').checked
      });
      if(!payload){
        var sameBrand = db.locations.filter(function(l){ return (l.brand||'').trim()===brand; });
        row.display_order = sameBrand.reduce(function(max,l){ return Math.max(max, l.displayOrder||0); }, 0) + 1;
      }
      withBusy(async function(){
        if(payload){
          var updated = await sbUpdate('locations', payload.id, row);
          Object.assign(payload, mapLocation(updated));
          toast('Location updated');
        } else {
          var created = await sbInsert('locations', row);
          db.locations.push(mapLocation(created));
          toast('Location added');
        }
        closeModal();
      });
    }
    var submitLocBtn = document.getElementById('submitLocForm'); if(submitLocBtn) submitLocBtn.addEventListener('click', submitLocForm);
    var locNameInput = document.getElementById('locName');
    if(locNameInput) locNameInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submitLocForm(); } });
    var deleteLoc = document.getElementById('deleteLoc');
    if(deleteLoc) deleteLoc.addEventListener('click', function(){
      var payload = state.modal.payload;
      confirmAction('Deactivate "'+payload.name+'"? It will no longer appear on the public site. (Records are archived, not permanently deleted, to keep menu item links intact. Use "Delete permanently" in the table if you want to remove it entirely.)', function(){
        withBusy(async function(){
          var updated = await sbUpdate('locations', payload.id, stamp({active:false}));
          Object.assign(payload, mapLocation(updated));
          state.confirm=null; closeModal(); toast('Location deactivated');
        });
      });
    });
  }

  /* ---- Category form ---- */
  var catForm = document.getElementById('catForm');
  if(catForm){
    function submitCatForm(){
      var name = document.getElementById('catName').value.trim();
      if(!name){ toast('Category name is required'); return; }
      var payload = state.modal.payload;
      var row = stamp({ name:name, description:document.getElementById('catDesc').value.trim(), active:document.getElementById('catActive').checked });
      withBusy(async function(){
        if(payload){
          var updated = await sbUpdate('categories', payload.id, row);
          Object.assign(payload, mapCategory(updated));
          toast('Category updated');
        } else {
          var maxOrder = db.categories.reduce(function(m,c){return Math.max(m,c.displayOrder);},0);
          row.display_order = maxOrder+1;
          var created = await sbInsert('categories', row);
          db.categories.push(mapCategory(created));
          toast('Category added');
        }
        closeModal();
      });
    }
    var submitCatBtn = document.getElementById('submitCatForm'); if(submitCatBtn) submitCatBtn.addEventListener('click', submitCatForm);
    var catNameInput = document.getElementById('catName');
    if(catNameInput) catNameInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submitCatForm(); } });
    var deleteCat = document.getElementById('deleteCat');
    if(deleteCat) deleteCat.addEventListener('click', function(){
      var payload = state.modal.payload;
      var used = db.menuItems.filter(function(m){return m.categoryId===payload.id;}).length;
      confirmAction('Deactivate "'+payload.name+'"?'+(used?' '+used+' menu item(s) will show as Uncategorised on the public menu.':'')+' Use "Delete permanently" in the table if you want to remove it entirely.', function(){
        withBusy(async function(){
          var updated = await sbUpdate('categories', payload.id, stamp({active:false}));
          Object.assign(payload, mapCategory(updated));
          state.confirm=null; closeModal(); toast('Category deactivated');
        });
      });
    });
  }

  /* ---- Ingredient form ---- */
  app.querySelectorAll('.status-toggle input[type=radio]').forEach(function(r){
    r.addEventListener('change', function(){
      var group = r.closest('.status-toggle');
      group.querySelectorAll('label').forEach(function(l){ l.classList.remove('sel','sel-may','sel-contains'); });
      var lbl = r.closest('label');
      lbl.classList.add('sel');
      if(r.value==='may') lbl.classList.add('sel-may');
      if(r.value==='contains') lbl.classList.add('sel-contains');
    });
  });
  var ingForm = document.getElementById('ingForm');
  if(ingForm){
    function submitIngForm(){
      var name = document.getElementById('ingName').value.trim();
      if(!name){ toast('Ingredient name is required'); return; }
      var allergens = [], mayContain = [];
      ALLERGENS.forEach(function(a){
        var checked = app.querySelector('input[name="alg_'+a.key+'"]:checked');
        var val = checked ? checked.value : 'none';
        if(val==='contains') allergens.push(a.key);
        else if(val==='may') mayContain.push(a.key);
      });
      var calRaw = document.getElementById('ingCalories').value.trim();
      var calories = calRaw==='' ? null : Math.max(0, Math.round(Number(calRaw)));
      if(calRaw!=='' && isNaN(calories)){ toast('Calories must be a number'); return; }
      var payload = state.modal.payload;
      var row = stamp({
        name:name, allergens:allergens, may_contain:mayContain, calories:calories,
        brand_name: document.getElementById('ingBrand').value.trim(),
        supplier: document.getElementById('ingSupplier').value.trim(),
        vegetarian: document.getElementById('ingVegetarian').checked,
        halal: document.getElementById('ingHalal').checked,
        description:document.getElementById('ingNotes').value.trim(), active:document.getElementById('ingActive').checked
      });
      withBusy(async function(){
        if(payload){
          var updated = await sbUpdate('ingredients', payload.id, row);
          Object.assign(payload, mapIngredient(updated));
          toast('Ingredient updated');
        } else {
          var created = await sbInsert('ingredients', row);
          db.ingredients.push(mapIngredient(created));
          toast('Ingredient added');
        }
        closeModal();
      });
    }
    var submitIngBtn = document.getElementById('submitIngForm'); if(submitIngBtn) submitIngBtn.addEventListener('click', submitIngForm);
    var ingNameInput = document.getElementById('ingName');
    if(ingNameInput) ingNameInput.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submitIngForm(); } });
    var deleteIng = document.getElementById('deleteIng');
    if(deleteIng) deleteIng.addEventListener('click', function(){
      var payload = state.modal.payload;
      var usedBy = db.menuItems.filter(function(m){return m.active && m.ingredientIds.indexOf(payload.id)!==-1;});
      confirmAction('Deactivate "'+payload.name+'"?'+(usedBy.length?' It is still used by: '+usedBy.map(function(m){return m.name;}).join(', ')+'.':'')+' Use "Delete permanently" in the table if you want to remove it entirely.', function(){
        withBusy(async function(){
          var updated = await sbUpdate('ingredients', payload.id, stamp({active:false}));
          Object.assign(payload, mapIngredient(updated));
          state.confirm=null; closeModal(); toast('Ingredient deactivated');
        });
      });
    });
  }

  /* ---- Menu item form ---- */
  var miForm = document.getElementById('miForm');
  if(miForm){
    var nameI = document.getElementById('miName'); if(nameI) nameI.addEventListener('input', function(){ menuItemFormState.name = nameI.value; });
    var descI = document.getElementById('miDesc'); if(descI) descI.addEventListener('input', function(){ menuItemFormState.description = descI.value; });
    var catI = document.getElementById('miCat'); if(catI) catI.addEventListener('change', function(){ menuItemFormState.categoryId = catI.value; });
    var activeI = document.getElementById('miActive'); if(activeI) activeI.addEventListener('change', function(){ menuItemFormState.active = activeI.checked; });
    app.querySelectorAll('[data-loc]').forEach(function(cb){
      if(!cb.matches('input')) return;
      cb.addEventListener('change', function(){
        var lid = cb.getAttribute('data-loc');
        var idx = menuItemFormState.locationIds.indexOf(lid);
        if(cb.checked && idx===-1) menuItemFormState.locationIds.push(lid);
        if(!cb.checked && idx!==-1) menuItemFormState.locationIds.splice(idx,1);
        render();
      });
    });
    var ingSearchInput = document.getElementById('ingSearchInput');
    if(ingSearchInput){
      ingSearchInput.addEventListener('input', function(){ menuItemFormState.ingSearch = ingSearchInput.value; render();
        setTimeout(function(){ var el3=document.getElementById('ingSearchInput'); if(el3){ el3.focus(); el3.setSelectionRange(el3.value.length, el3.value.length);} },0);
      });
    }
    app.querySelectorAll('[data-add-ing]').forEach(function(b){
      b.addEventListener('click', function(){ menuItemFormState.ingredientIds.push(b.getAttribute('data-add-ing')); render(); });
    });
    app.querySelectorAll('[data-remove-ing]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-remove-ing');
        var idx = menuItemFormState.ingredientIds.indexOf(id);
        if(idx!==-1) menuItemFormState.ingredientIds.splice(idx,1);
        render();
      });
    });
    app.querySelectorAll('[data-move-ing]').forEach(function(b){
      b.addEventListener('click', function(){
        var parts = b.getAttribute('data-move-ing').split(':'); var dir=parts[0], id=parts[1];
        var idx = menuItemFormState.ingredientIds.indexOf(id);
        var swap = dir==='up'?idx-1:idx+1;
        if(swap<0 || swap>=menuItemFormState.ingredientIds.length) return;
        var tmp = menuItemFormState.ingredientIds[idx];
        menuItemFormState.ingredientIds[idx] = menuItemFormState.ingredientIds[swap];
        menuItemFormState.ingredientIds[swap] = tmp;
        render();
      });
    });
    function submitMiForm(){
      var name = menuItemFormState.name.trim();
      if(!name){ toast('Menu item name is required'); return; }
      var locationIds = menuItemFormState.locationIds.slice();
      var ingredientIds = menuItemFormState.ingredientIds.slice();
      var row = stamp({
        name:name, description:menuItemFormState.description.trim(), category_id: menuItemFormState.categoryId || null,
        active: menuItemFormState.active
      });
      var noIngredientsWarning = !ingredientIds.length;
      var payload = state.modal.payload;
      withBusy(async function(){
        var miRow = payload ? await sbUpdate('menu_items', payload.id, row) : await sbInsert('menu_items', row);
        var miId = miRow.id;
        // Resync both link tables: clear existing links for this item, then write the current set fresh.
        await Promise.all([
          sb.from('menu_item_locations').delete().eq('menu_item_id', miId),
          sb.from('menu_item_ingredients').delete().eq('menu_item_id', miId)
        ]);
        var inserts = [];
        if(locationIds.length){
          inserts.push(sb.from('menu_item_locations').insert(locationIds.map(function(lid){ return {menu_item_id: miId, location_id: lid}; })));
        }
        if(ingredientIds.length){
          inserts.push(sb.from('menu_item_ingredients').insert(ingredientIds.map(function(iid, idx){ return {menu_item_id: miId, ingredient_id: iid, sort_order: idx}; })));
        }
        var insertResults = await Promise.all(inserts);
        insertResults.forEach(function(r){ if(r.error) throw r.error; });

        var mapped = mapMenuItem(miRow, [], []);
        mapped.locationIds = locationIds;
        mapped.ingredientIds = ingredientIds;
        if(payload){ Object.assign(payload, mapped); toast('Menu item updated'); }
        else { db.menuItems.push(mapped); toast(noIngredientsWarning ? 'Saved — note: this item has no ingredients connected' : 'Menu item added'); }
        menuItemFormState=null; closeModal();
      });
    }
    var submitMiBtn = document.getElementById('submitMiForm'); if(submitMiBtn) submitMiBtn.addEventListener('click', submitMiForm);
    if(nameI) nameI.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submitMiForm(); } });
    var deleteMi = document.getElementById('deleteMi');
    if(deleteMi) deleteMi.addEventListener('click', function(){
      var payload = state.modal.payload;
      confirmAction('Deactivate "'+payload.name+'"? It will be removed from all public menus but its record is kept. Use "Delete permanently" in the table if you want to remove it entirely.', function(){
        withBusy(async function(){
          var updated = await sbUpdate('menu_items', payload.id, stamp({active:false}));
          payload.active = updated.active; payload.updatedBy = resolveUpdatedBy(updated.updated_by); payload.updatedAt = updated.updated_at;
          state.confirm=null; menuItemFormState=null; closeModal(); toast('Menu item deactivated');
        });
      });
    });
  }

  /* ---- Team: account form (edit only — accounts are created via the Supabase dashboard) ---- */
  var acctForm = document.getElementById('acctForm');
  if(acctForm){
    function submitAcctForm(){
      var payload = state.modal.payload;
      if(!payload) return;
      var isSelf = payload.id === state.admin.currentUserId;
      var displayName = document.getElementById('acctDisplayName').value.trim();
      var activeEl = document.getElementById('acctActive');
      var roleEl = app.querySelector('input[name="acctRole"]:checked');
      var row = { display_name: displayName };
      if(!isSelf){
        if(roleEl) row.role = roleEl.value;
        if(activeEl) row.active = activeEl.checked;
      }
      withBusy(async function(){
        var updated = await sbUpdate('profiles', payload.id, row);
        Object.assign(payload, mapProfile(updated));
        profileNameById[payload.id] = updated.display_name || updated.email;
        toast('Team member updated');
        closeModal();
      });
    }
    var submitAcctBtn = document.getElementById('submitAcctForm'); if(submitAcctBtn) submitAcctBtn.addEventListener('click', submitAcctForm);
  }
  app.querySelectorAll('[data-edit-acct]').forEach(function(b){
    b.addEventListener('click', function(){ var a = db.settings.admins.find(function(x){return x.id===b.getAttribute('data-edit-acct');}); setModal({type:'account', payload:a}); });
  });
  app.querySelectorAll('[data-toggle-acct]').forEach(function(b){
    b.addEventListener('click', function(){
      var a = db.settings.admins.find(function(x){return x.id===b.getAttribute('data-toggle-acct');});
      if(a.id === state.admin.currentUserId){ toast('You can\u2019t deactivate your own account'); return; }
      withBusy(async function(){
        var updated = await sbUpdate('profiles', a.id, { active: !a.active });
        Object.assign(a, mapProfile(updated));
        toast(a.username+' is now '+(a.active?'active':'inactive')); render();
      });
    });
  });

  /* ---- Confirm modal ---- */
  var confirmNo = document.getElementById('confirmNo'); if(confirmNo) confirmNo.addEventListener('click', function(){ state.confirm=null; render(); });
  var confirmYes = document.getElementById('confirmYes'); if(confirmYes) confirmYes.addEventListener('click', function(){ if(state.confirm && state.confirm.onConfirm) state.confirm.onConfirm(); });

  /* ---- Settings screen ---- */
  var showCaloriesToggle = document.getElementById('showCaloriesToggle');
  if(showCaloriesToggle) showCaloriesToggle.addEventListener('change', function(){
    var next = showCaloriesToggle.checked;
    withBusy(async function(){
      var res = await sb.from('app_settings').update({show_calories: next, updated_at: new Date().toISOString()}).eq('id', true).select().single();
      if(res.error) throw res.error;
      db.settings.showCalories = !!res.data.show_calories;
      toast('Calories are now '+(db.settings.showCalories?'visible':'hidden')+' to customers'); render();
    });
  });
  var resetDataBtn = document.getElementById('resetDataBtn');
  if(resetDataBtn) resetDataBtn.addEventListener('click', function(){
    confirmAction('Clear all locations, categories, ingredients and menu items from the live database, for everyone? Team accounts are kept. This cannot be undone \u2014 export a backup first if you want to keep a copy.', function(){
      withBusy(async function(){
        // Delete in FK-safe order: junction tables first, then the tables they reference.
        await sb.from('menu_item_locations').delete().neq('menu_item_id', '00000000-0000-0000-0000-000000000000');
        await sb.from('menu_item_ingredients').delete().neq('menu_item_id', '00000000-0000-0000-0000-000000000000');
        await sb.from('menu_items').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        await sb.from('ingredients').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        await sb.from('categories').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        await sb.from('locations').delete().neq('id', '00000000-0000-0000-0000-000000000000');
        db.locations = []; db.categories = []; db.ingredients = []; db.menuItems = [];
        state.confirm=null; toast('All menu data cleared'); render();
      });
    });
  });
  var exportJson = document.getElementById('exportJson');
  if(exportJson) exportJson.addEventListener('click', function(){
    var blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'allergen-guide-data-'+(new Date().toISOString().slice(0,10))+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    toast('Export downloaded');
  });
}

function renderMenuOnly(){ render(); }

function renderLoadingScreen(msg){
  var app = document.getElementById('app');
  app.innerHTML = '<div class="login-shell"><div class="login-card">'+
    '<div class="brand-mark" style="margin:0 auto 14px;">'+BRAND_SVG+'</div>'+
    '<h1>'+esc(APP_TITLE)+'</h1>'+
    '<p>'+esc(msg)+'</p>'+
  '</div></div>';
}
function renderLoadErrorScreen(){
  var app = document.getElementById('app');
  app.innerHTML = '<div class="login-shell"><div class="login-card">'+
    '<div class="brand-mark" style="margin:0 auto 14px;">'+BRAND_SVG+'</div>'+
    '<h1>Can\u2019t connect</h1>'+
    '<p>We couldn\u2019t reach the database. '+esc(LOAD_ERROR||'')+'</p>'+
    '<button class="btn btn-primary btn-block" id="retryLoad">Try again</button>'+
  '</div></div>';
  var r = document.getElementById('retryLoad'); if(r) r.addEventListener('click', boot);
}

async function boot(){
  renderLoadingScreen('Loading the allergen guide\u2026');
  await loadAllData();
  if(LOAD_ERROR){ renderLoadErrorScreen(); return; }
  try{
    var sessRes = await sb.auth.getSession();
    var session = sessRes && sessRes.data && sessRes.data.session;
    if(session && session.user){
      var prof = db.settings.admins.find(function(a){ return a.id===session.user.id; });
      if(prof && prof.active){
        state.admin.loggedIn = true;
        state.admin.currentUser = prof.displayName;
        state.admin.currentUserId = prof.id;
        state.admin.currentUserRole = prof.role;
        if(prof.role==='viewer'){ state.screen = 'landing'; }
      } else {
        await sb.auth.signOut(); // stale/deactivated account — don't leave them half-logged-in
      }
    }
  }catch(e){ console.error('Session restore failed: ' + safeErrText(e)); }
  render();
}
boot();

})();
</script>
</body>
</html>
